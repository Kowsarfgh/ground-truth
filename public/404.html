<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GROUND TRUTH</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Single Page Apps for GitHub Pages.
      // GitHub Pages serves this file for any path without a matching asset.
      // It re-encodes the requested route into the query string and hands it
      // back to index.html, which restores the real path for the router.
      // pathSegmentsToKeep = 1 because this is a project site (/<repo>/...).
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body>
    <noscript>GROUND TRUTH needs JavaScript enabled.</noscript>
  </body>
</html>
